services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jemp
      POSTGRES_USER: jemp
      POSTGRES_PASSWORD: change-this-in-production
    volumes:
      - jemp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jemp -d jemp"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jemp:change-this-in-production@postgres:5432/jemp?schema=public
      INTERNAL_API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  jemp_postgres:
